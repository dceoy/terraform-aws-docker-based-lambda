---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - '*'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - '*'
  - package-ecosystem: terraform
    directories:
      - /modules/kms/
      - /modules/docker/
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      terraform-dependencies:
        patterns:
          - '*'
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      pip-dependencies:
        patterns:
          - '*'
